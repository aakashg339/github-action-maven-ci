name: maven Github Actions
on:
  push:
    branches: [main]
  pull_request:
    branches: ['main']
jobs:
  test:
    name: runs test on maven
    runs-on: ubuntu-latest
    steps:
      - name: get source code
        uses: actions/checkout@v7
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: running test
        run: mvn test

  build:
    needs: test
    name: building maven
    runs_on: ubuntu-latest
    steps:
      - name: get source code
        uses: actions/checkout@v7
      - name: setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: building jar file
        run: mvn clean package